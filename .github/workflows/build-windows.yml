name: Build Windows AI App

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build single-file Windows app
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name 4GImageGenerator --collect-all PIL app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 4GImageGenerator-Windows-AI
          path: dist/4GImageGenerator.exe
          if-no-files-found: error
      - name: Attach EXE to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/4GImageGenerator.exe
