name: Build Windows AI App

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Download and verify stable-diffusion.cpp runtime
        shell: pwsh
        run: |
          $url = "https://github.com/leejet/stable-diffusion.cpp/releases/download/master-890-74988b2/sd-master-74988b2-bin-win-vulkan-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile runtime.zip
          $actual = (Get-FileHash runtime.zip -Algorithm SHA256).Hash.ToLower()
          $expected = "744c8f817c66ecfd02fbb9dc8b122e1f29f7240db1f6086dfde2669403c5d896"
          if ($actual -ne $expected) { throw "Runtime checksum mismatch: $actual" }
          New-Item -ItemType Directory -Path runtime | Out-Null
          Expand-Archive runtime.zip -DestinationPath runtime
          if (-not (Test-Path runtime\\sd-cli.exe)) { throw "sd-cli.exe missing from runtime archive" }
      - name: Build single-file Windows app
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name 4GImageGenerator --collect-all PIL
          --add-data "runtime;runtime" app.py
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 4GImageGenerator-Windows-AI
          path: dist/4GImageGenerator.exe
          if-no-files-found: error
      - name: Attach EXE to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/4GImageGenerator.exe
